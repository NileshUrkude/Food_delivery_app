services:
  - type: web
    name: fast-fooddy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements/production.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: fast-fooddy.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://fast-fooddy.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: fast-fooddy-db
          property: connectionString

databases:
  - name: fast-fooddy-db
    databaseName: fast_fooddy
    user: fast_fooddy
    plan: free