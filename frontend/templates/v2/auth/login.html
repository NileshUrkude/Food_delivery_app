{% extends "v2/base.html" %}
{% load static %}

{% block title %}Login | Fast Fooddy{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <h1 class="h3 text-center mb-4">Welcome back</h1>
                    <p class="text-muted text-center small mb-4">Sign in to order food and track your deliveries.</p>

                    <div id="login-message" class="alert d-none" role="alert"></div>

                    <form id="login-form" novalidate>
                        <div class="mb-3">
                            <label for="login-email" class="form-label">Email</label>
                            <input type="email" id="login-email" class="form-control" required autocomplete="email" placeholder="you@example.com">
                        </div>
                        <div class="mb-4">
                            <label for="login-password" class="form-label">Password</label>
                            <input type="password" id="login-password" class="form-control" required autocomplete="current-password" placeholder="••••••••">
                        </div>
                        <button type="submit" id="login-button" class="btn btn-primary w-100">Login</button>
                    </form>

                    <p class="text-center mt-4 mb-0 small">
                        Don't have an account?
                        <a href="{% url 'frontend:register' %}">Register</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
