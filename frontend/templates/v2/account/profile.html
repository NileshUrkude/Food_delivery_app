{% extends "v2/base.html" %}
{% load static %}

{% block title %}My Profile | FoodDelivery{% endblock %}

{% block content %}
<div class="container py-5">
    <h1 class="h3 mb-4">My Profile</h1>
    <div id="profile-message" class="alert d-none" role="alert"></div>

    <div class="row g-4">
        <div class="col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="h5 mb-4">Account Information</h2>
                    <form id="profile-form">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" id="username" class="form-control" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="phone-number" class="form-label">Phone Number</label>
                            <input type="tel" id="phone-number" class="form-control" readonly>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="first-name" class="form-label">First Name</label>
                                <input type="text" id="first-name" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label for="last-name" class="form-label">Last Name</label>
                                <input type="text" id="last-name" class="form-control">
                            </div>
                        </div>
                        <button type="submit" id="update-profile-button" class="btn btn-primary mt-4">Update Profile</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="h5 mb-4">Quick Links</h2>
                    <div class="d-grid gap-2">
                        <a href="/orders/" class="btn btn-outline-primary"><i class="bi bi-bag-check me-2"></i>My Orders</a>
                        <a href="/cart/" class="btn btn-outline-secondary"><i class="bi bi-cart3 me-2"></i>My Cart</a>
                        <a href="/" class="btn btn-outline-secondary"><i class="bi bi-shop me-2"></i>Browse Restaurants</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'v2/js/pages/profile.js' %}"></script>
{% endblock %}
