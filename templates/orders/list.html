{% extends "base.html" %}

{% load static %}


{% block title %}

    My Orders | FoodDelivery

{% endblock %}


{% block content %}

<div class="container py-5">

    <h1 class="mb-4">
        My Orders
    </h1>


    <div
        id="orders-message"
        class="alert d-none"
    ></div>


    <div
        id="orders-list"
    >

        <div class="text-center">

            <div
                class="spinner-border
                       text-primary"
            ></div>

            <p class="mt-2">
                Loading orders...
            </p>

        </div>

    </div>

</div>

{% endblock %}


{% block extra_js %}

<script
    src="{% static 'js/orders.js' %}"
></script>

{% endblock %}
