{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0
        "
    >

    <title>
        {% block title %}
            FoodDelivery
        {% endblock %}
    </title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Project CSS -->

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >


    {% block extra_css %}
    {% endblock %}

</head>


<body>


    {% include "includes/navbar.html" %}


    <main>

        {% block content %}
        {% endblock %}

    </main>


    {% include "includes/footer.html" %}


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- Common API -->

    <script
        src="{% static 'js/api.js' %}"
    ></script>


    {% block extra_js %}
    {% endblock %}

</body>

</html>
