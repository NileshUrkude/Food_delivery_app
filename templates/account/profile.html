{% extends "base.html" %}

{% load static %}


{% block title %}

    My Profile | FoodDelivery

{% endblock %}


{% block content %}

<div class="container py-5">


    <h1 class="mb-4">
        My Profile
    </h1>


    <div
        id="profile-message"
        class="alert d-none"
    ></div>


    <div class="row g-4">


        <!-- Profile Information -->

        <div class="col-lg-7">

            <div
                class="card shadow-sm"
            >

                <div
                    class="card-body p-4"
                >

                    <h4 class="mb-4">
                        Account Information
                    </h4>


                    <form
                        id="profile-form"
                    >


                        <div class="mb-3">

                            <label
                                for="username"
                                class="form-label"
                            >
                                Username
                            </label>


                            <input
                                type="text"
                                id="username"
                                class="form-control"
                                readonly
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label"
                            >
                                Email
                            </label>


                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                readonly
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="first-name"
                                class="form-label"
                            >
                                First Name
                            </label>


                            <input
                                type="text"
                                id="first-name"
                                class="form-control"
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="last-name"
                                class="form-label"
                            >
                                Last Name
                            </label>


                            <input
                                type="text"
                                id="last-name"
                                class="form-control"
                            >

                        </div>


                        <button
                            type="submit"
                            id="update-profile-button"
                            class="btn btn-primary"
                        >
                            Update Profile
                        </button>


                    </form>

                </div>

            </div>

        </div>


        <!-- Quick Links -->

        <div class="col-lg-5">

            <div
                class="card shadow-sm"
            >

                <div
                    class="card-body p-4"
                >

                    <h4 class="mb-4">
                        Quick Links
                    </h4>


                    <div
                        class="d-grid gap-2"
                    >

                        <a
                            href="/orders/"
                            class="btn
                                   btn-outline-primary"
                        >
                            My Orders
                        </a>


                        <a
                            href="/cart/"
                            class="btn
                                   btn-outline-secondary"
                        >
                            My Cart
                        </a>


                        <a
                            href="/"
                            class="btn
                                   btn-outline-secondary"
                        >
                            Browse Restaurants
                        </a>

                    </div>

                </div>

            </div>

        </div>


    </div>

</div>

{% endblock %}


{% block extra_js %}

<script
    src="{% static 'js/profile.js' %}"
></script>

{% endblock %}
