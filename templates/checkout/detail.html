{% extends "base.html" %}

{% load static %}


{% block title %}

    Checkout | FoodDelivery

{% endblock %}


{% block content %}

<div class="container py-5">

    <h1 class="mb-4">
        Checkout
    </h1>


    <div
        id="checkout-message"
        class="alert d-none"
    ></div>


    <div class="row g-4">


        <!-- Delivery Address -->

        <div class="col-lg-7">

            <div
                class="card shadow-sm"
            >

                <div
                    class="card-body p-4"
                >

                    <h4 class="mb-4">
                        Delivery Address
                    </h4>


                    <form
                        id="checkout-form"
                    >

                        <div class="mb-3">

                            <label
                                for="address"
                                class="form-label"
                            >
                                Address
                            </label>

                            <textarea
                                id="address"
                                class="form-control"
                                rows="4"
                                required
                            ></textarea>

                        </div>


                        <div class="row">

                            <div class="col-md-6">

                                <div class="mb-3">

                                    <label
                                        for="city"
                                        class="form-label"
                                    >
                                        City
                                    </label>

                                    <input
                                        type="text"
                                        id="city"
                                        class="form-control"
                                        required
                                    >

                                </div>

                            </div>


                            <div class="col-md-6">

                                <div class="mb-3">

                                    <label
                                        for="postal-code"
                                        class="form-label"
                                    >
                                        Postal Code
                                    </label>

                                    <input
                                        type="text"
                                        id="postal-code"
                                        class="form-control"
                                        required
                                    >

                                </div>

                            </div>

                        </div>


                        <button
                            type="submit"
                            id="place-order-button"
                            class="btn btn-primary w-100"
                        >
                            Place Order
                        </button>

                    </form>

                </div>

            </div>

        </div>


        <!-- Order Summary -->

        <div class="col-lg-5">

            <div
                class="card shadow-sm"
            >

                <div
                    class="card-body p-4"
                >

                    <h4 class="mb-4">
                        Order Summary
                    </h4>


                   <div
                        id="checkout-summary"
                    >

                        <div class="text-center">

                            <div
                                class="spinner-border
                                    text-primary"
                            ></div>

                            <p class="mt-2">
                                Loading cart...
                            </p>

                        </div>

                    </div>


                    <!-- Coupon Section -->

                    <div
                        id="coupon-section"
                        class="mt-4"
                    >

                        <label
                            for="coupon-code"
                            class="form-label"
                        >
                            Coupon Code
                        </label>


                        <div
                            class="input-group"
                        >

                            <input
                                type="text"
                                id="coupon-code"
                                class="form-control"
                                placeholder="Enter coupon code"
                            >


                            <button
                                type="button"
                                id="apply-coupon-button"
                                class="btn btn-outline-primary"
                            >
                                Apply
                            </button>

                            <button
                                type="button"
                                id="remove-coupon-button"
                                class="btn btn-outline-danger d-none"
                            >
                                Remove
                            </button>

                        </div>


                        <div
                            id="coupon-message"
                            class="mt-2"
                        ></div>

                    </div>



                </div>

            </div>

        </div>


    </div>

</div>

{% endblock %}


{% block extra_js %}

<script
    src="{% static 'js/checkout.js' %}"
></script>

{% endblock %}
