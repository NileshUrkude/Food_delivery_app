{% extends "base.html" %}


{% block title %}

    Login | FoodDelivery

{% endblock %}


{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Login
                    </h2>


                    <div
                        id="login-message"
                        class="alert d-none"
                        role="alert"
                    ></div>


                    <form
                        id="login-form"
                    >

                        <div class="mb-3">

                            <label
                                for="login-email"
                                class="form-label"
                            >
                                Email
                            </label>

                            <input
                                type="email"
                                id="login-email"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="login-password"
                                class="form-label"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                id="login-password"
                                class="form-control"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            id="login-button"
                            class="btn btn-primary w-100"
                        >
                            Login
                        </button>

                    </form>


                    <p class="text-center mt-3 mb-0">

                        Don't have an account?

                        <a
                            href="{% url 'frontend:register' %}"
                        >
                            Register
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}


{% block extra_js %}

{% load static %}

<script
    src="{% static 'js/auth.js' %}"
></script>

{% endblock %}
