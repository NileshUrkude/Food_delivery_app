
{% extends "base.html" %}


{% block title %}

    Register | FoodDelivery

{% endblock %}


{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Create Account
                    </h2>


                    <div
                        id="register-message"
                        class="alert d-none"
                        role="alert"
                    ></div>


                    <form
                        id="register-form"
                    >

                        <!-- Email -->

                        <div class="mb-3">

                            <label
                                for="register-email"
                                class="form-label"
                            >
                                Email
                            </label>

                            <input
                                type="email"
                                id="register-email"
                                class="form-control"
                                required
                            >

                        </div>


                        <!-- First Name -->

                        <div class="mb-3">

                            <label
                                for="register-first-name"
                                class="form-label"
                            >
                                First Name
                            </label>

                            <input
                                type="text"
                                id="register-first-name"
                                class="form-control"
                            >

                        </div>


                        <!-- Last Name -->

                        <div class="mb-3">

                            <label
                                for="register-last-name"
                                class="form-label"
                            >
                                Last Name
                            </label>

                            <input
                                type="text"
                                id="register-last-name"
                                class="form-control"
                            >

                        </div>


                        <!-- Phone Number -->

                        <div class="mb-3">

                            <label
                                for="register-phone-number"
                                class="form-label"
                            >
                                Phone Number
                            </label>

                            <input
                                type="text"
                                id="register-phone-number"
                                class="form-control"
                            >

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label
                                for="register-password"
                                class="form-label"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                id="register-password"
                                class="form-control"
                                minlength="8"
                                required
                            >

                        </div>


                        <!-- Confirm Password -->

                        <div class="mb-3">

                            <label
                                for="register-confirm-password"
                                class="form-label"
                            >
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                id="register-confirm-password"
                                class="form-control"
                                minlength="8"
                                required
                            >

                        </div>


                        <!-- Role -->

                        <div class="mb-3">

                            <label
                                for="register-role"
                                class="form-label"
                            >
                                Register As
                            </label>

                            <select
                                id="register-role"
                                class="form-select"
                            >

                                <option
                                    value="customer"
                                    selected
                                >
                                    Customer
                                </option>

                                <option
                                    value="restaurant_owner"
                                >
                                    Restaurant Owner
                                </option>

                            </select>

                        </div>


                        <!-- Register Button -->

                        <button
                            type="submit"
                            id="register-button"
                            class="btn btn-primary w-100"
                        >
                            Register
                        </button>

                    </form>


                    <p class="text-center mt-3 mb-0">

                        Already have an account?

                        <a
                            href="{% url 'frontend:login' %}"
                        >
                            Login
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}


{% block extra_js %}

{% load static %}

<script
    src="{% static 'js/auth.js' %}"
></script>

{% endblock %}
