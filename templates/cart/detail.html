{% extends "base.html" %}

{% load static %}


{% block title %}

    My Cart | FoodDelivery

{% endblock %}


{% block content %}

<div class="container py-5">


    <h1 class="mb-4">
        My Cart
    </h1>


    <!-- Cart Message -->

    <div
        id="cart-message"
        class="alert d-none"
    ></div>


    <!-- Cart Content -->

    <div
        id="cart-container"
    >

        <div class="text-center">

            <div
                class="spinner-border
                       text-primary"
            ></div>

            <p class="mt-2">
                Loading cart...
            </p>

        </div>

    </div>


</div>

{% endblock %}


{% block extra_js %}

<script
    src="{% static 'js/cart.js' %}"
></script>

{% endblock %}
